<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUG 风险评估工具</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;margin:0;color:#1f2937}
.wrap{max-width:680px;margin:0 auto;padding:56px 20px}
h1{font-size:24px}
.sub{color:#6b7280;font-size:14px;margin:8px 0 28px;line-height:1.6}
.card{display:block;background:#fff;border:1px solid #e5e9f2;border-radius:12px;padding:18px 20px;margin:14px 0;text-decoration:none;color:#1f2937;transition:.2s}
.card:hover{border-color:#2f80ed;box-shadow:0 4px 14px rgba(47,128,237,.12)}
.card .t{font-size:16px;font-weight:600;color:#1f4e79}
.card .d{font-size:13px;color:#6b7280;margin-top:6px}
.note{font-size:12px;color:#9aa5b1;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
<h1>BUG 风险评估工具</h1>
<div class="sub">点击进入对应可视化界面（数据在浏览器本地处理，不会上传）</div>
<a class="card" href="BUG风险评估工具.html">
  <div class="t">BUG 风险评估工具（单条维度打分）</div>
  <div class="d">Excel 输入 → 10 维自动打分 → 风险矩阵 / 雷达图 → 回写 Excel</div>
</a>
<a class="card" href="BUG分析自动化工具.html">
  <div class="t">BUG 分析自动化工具（模块级分析）</div>
  <div class="d">Excel 输入 → 优先级 / 模块 / 开发负载 / 趋势 → 风险评估汇总报告</div>
</a>
<div class="note">首次打开需联网加载 Chart.js / SheetJS；示例数据见「示例BUG清单.xlsx」。</div>
</div>
</body>
</html>
